name: Android Debug APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore persistent debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is required; refusing to generate a different signing key."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ssipduck-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ssipduck-debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "SSIPDUCK_DEBUG_KEYSTORE=$RUNNER_TEMP/ssipduck-debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/build/outputs/apk/debug/android-debug.apk'

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ssipduck-debug.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ssipduck-debug-${{ github.run_number }}
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
